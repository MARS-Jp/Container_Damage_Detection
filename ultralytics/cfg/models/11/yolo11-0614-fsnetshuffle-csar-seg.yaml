# Ultralytics YOLO11 instance segmentation model with FSNetShuffle + AttentionResiduals backbone and CSAR refinement.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-0614-fsnetshuffle-csar-seg.yaml' will call yolo11-0614-fsnetshuffle-csar-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-FSNetShuffle backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4

  - [[0, 1], 1, FSNetShuffle, [128, 1, 2]] # 2-P2/4, S target P2
  - [-1, 2, AttentionResiduals, [256, 0.25]] # 3-P2/4

  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [[3, 4], 1, FSNetShuffle, [256, 1, 2]] # 5-P3/8, S target P3
  - [-1, 2, AttentionResiduals, [512, 0.25]] # 6-P3/8

  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [[3, 6, 7], 1, FSNetShuffle, [512, 2, 2]] # 8-P4/16, S target P4
  - [-1, 2, AttentionResiduals, [512]] # 9-P4/16

  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [[6, 9, 10], 1, FSNetShuffle, [1024, 2, 2]] # 11-P5/32, S target P5
  - [-1, 2, AttentionResiduals, [1024]] # 12-P5/32

  - [-1, 1, SPPF, [1024, 5]] # 13
  - [-1, 2, C2PSA, [1024]] # 14-P5/32

# Post-backbone CSAR segmentation head
head:
  - [[3, 6, 9, 14], 1, CSAR, [512, 4, 1, 0.5, True]] # 15-P3/8 refined from P2/P3/P4/P5
  - [[3, 6, 9, 14], 1, CSAR, [512, 4, 2, 0.5, True]] # 16-P4/16 refined from P2/P3/P4/P5
  - [[3, 6, 9, 14], 1, CSAR, [1024, 4, 3, 0.5, True]] # 17-P5/32 refined from P2/P3/P4/P5

  - [[3, 15, 16, 17], 1, CSAR, [512, 4, 1, 0.5, True]] # 18-P3/8
  - [[3, 15, 16, 17], 1, CSAR, [512, 4, 2, 0.5, True]] # 19-P4/16
  - [[3, 15, 16, 17], 1, CSAR, [1024, 4, 3, 0.5, True]] # 20-P5/32

  - [[18, 19, 20], 1, Segment26, [nc, 32, 256]] # Segment26(refined P3, P4, P5) with dense auxiliary heatmap/seedmap heads
