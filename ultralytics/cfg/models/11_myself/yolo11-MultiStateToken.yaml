# Ultralytics YOLO11 instance segmentation model with explicit multi-state token fusion.
#
# MultiStateCSAR treats aligned P2-P6 features as multiple states of the same spatial token.
# The second cross-scale stage mixes the state axis before content-dependent aggregation.

# Parameters
nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-FSNetShuffle backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4

  - [-1, 2, AttentionResiduals, [256, 0.25]] # 2-P2/4
  - [[1, 2], 1, FSNetShuffle, [128, 1, 2]] # 3-P2/4; target is AttentionResiduals output

  - [3, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [4, 2, AttentionResiduals, [512, 0.25]] # 5-P3/8
  - [[4, 5], 1, FSNetShuffle, [256, 1, 2]] # 6-P3/8

  - [6, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [7, 2, AttentionResiduals, [512]] # 8-P4/16
  - [[7, 8], 1, FSNetShuffle, [512, 1, 2]] # 9-P4/16

  - [9, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [10, 2, AttentionResiduals, [1024]] # 11-P5/32
  - [[10, 11], 1, FSNetShuffle, [1024, 1, 2]] # 12-P5/32

  - [-1, 1, SPPF, [1024, 5]] # 13
  - [-1, 2, C2PSA, [1024]] # 14-P5/32

# CSAR -> FSNetShuffle -> MultiStateCSAR segmentation head
head:
  - [14, 1, Conv, [1024, 3, 2]] # 15-P6/64

  # First cross-scale stage produces one feature at every source resolution.
  - [[3, 6, 9, 14, 15], 1, CSAR, [128, 4, 0, 0.5, True]] # 16-P2/4
  - [[3, 6, 9, 14, 15], 1, CSAR, [256, 4, 1, 0.5, True]] # 17-P3/8
  - [[3, 6, 9, 14, 15], 1, CSAR, [512, 4, 2, 0.5, True]] # 18-P4/16
  - [[3, 6, 9, 14, 15], 1, CSAR, [1024, 4, 3, 0.5, True]] # 19-P5/32
  - [[3, 6, 9, 14, 15], 1, CSAR, [1024, 4, 4, 0.5, True]] # 20-P6/64

  # Exchange projected channels while retaining one output per target resolution.
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [128, 0, 2]] # 21-P2/4
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [256, 1, 2]] # 22-P3/8
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [512, 2, 2]] # 23-P4/16
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [1024, 3, 2]] # 24-P5/32
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [1024, 4, 2]] # 25-P6/64

  # Multi-state stage: [c2, heads, target, attention ratio, shortcut, state expansion].
  - [[21, 22, 23, 24, 25], 1, MultiStateCSAR, [128, 4, 0, 0.5, True, 2.0]] # 26-P2/4
  - [[21, 22, 23, 24, 25], 1, MultiStateCSAR, [256, 4, 1, 0.5, True, 2.0]] # 27-P3/8
  - [[21, 22, 23, 24, 25], 1, MultiStateCSAR, [512, 4, 2, 0.5, True, 2.0]] # 28-P4/16
  - [[21, 22, 23, 24, 25], 1, MultiStateCSAR, [1024, 4, 3, 0.5, True, 2.0]] # 29-P5/32
  - [[21, 22, 23, 24, 25], 1, MultiStateCSAR, [1024, 4, 4, 0.5, True, 2.0]] # 30-P6/64

  # P3 is first so Proto26 upsamples it to image/4; P2 remains a detection and prototype-fusion input.
  - [[27, 26, 28, 29, 30], 1, Segment26, [nc, 32, 256]] # 31-Segment(P3, P2, P4, P5, P6)
