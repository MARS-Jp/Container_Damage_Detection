# Ultralytics YOLO11 instance segmentation model with MSAT V2 multi-label state supervision.
#
# This is an independent successor to yolo11-MSAT-V1.yaml. V1 and MultiStateCSAR models remain unchanged.
# Every damage class uses its own query to read evidence from the five post-Transformer states. The auxiliary loss
# builds multi-hot pixel targets from independent overlapping instance masks.
#
# Training requirement: overlap_mask=False.

# Parameters
nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-FSNetShuffle backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4

  - [-1, 2, AttentionResiduals, [256, 0.25]] # 2-P2/4
  - [[1, 2], 1, FSNetShuffle, [128, 1, 2]] # 3-P2/4

  - [3, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [4, 2, AttentionResiduals, [512, 0.25]] # 5-P3/8
  - [[4, 5], 1, FSNetShuffle, [256, 1, 2]] # 6-P3/8

  - [6, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [7, 2, AttentionResiduals, [512]] # 8-P4/16
  - [[7, 8], 1, FSNetShuffle, [512, 1, 2]] # 9-P4/16

  - [9, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [10, 2, AttentionResiduals, [1024]] # 11-P5/32
  - [[10, 11], 1, FSNetShuffle, [1024, 1, 2]] # 12-P5/32

  - [-1, 1, SPPF, [1024, 5]] # 13
  - [-1, 2, C2PSA, [1024]] # 14-P5/32

# CSAR -> FSNetShuffle -> class-conditioned MSAT V2 segmentation neck/head
head:
  - [14, 1, Conv, [1024, 3, 2]] # 15-P6/64

  # First cross-scale refinement stage.
  - [[3, 6, 9, 14, 15], 1, CSAR, [128, 4, 0, 0.5, True]] # 16-P2/4
  - [[3, 6, 9, 14, 15], 1, CSAR, [256, 4, 1, 0.5, True]] # 17-P3/8
  - [[3, 6, 9, 14, 15], 1, CSAR, [512, 4, 2, 0.5, True]] # 18-P4/16
  - [[3, 6, 9, 14, 15], 1, CSAR, [1024, 4, 3, 0.5, True]] # 19-P5/32
  - [[3, 6, 9, 14, 15], 1, CSAR, [1024, 4, 4, 0.5, True]] # 20-P6/64

  # Cross-scale channel exchange.
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [128, 0, 2]] # 21-P2/4
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [256, 1, 2]] # 22-P3/8
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [512, 2, 2]] # 23-P4/16
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [1024, 3, 2]] # 24-P5/32
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [1024, 4, 2]] # 25-P6/64

  # Each MSAT returns (fused feature, auxiliary logits); Index keeps both as explicit graph outputs.
  # Args: [c2, nc, heads, target, embed_channels(0=auto), FFN ratio, window size, shortcut].
  - [[21, 22, 23, 24, 25], 1, MSATMultiLabel, [128, nc, 4, 0, 0, 2.0, 8, True]] # 26-P2/4
  - [26, 1, Index, [-1, 0]] # 27-P2 fused
  - [26, 1, Index, [nc, 1]] # 28-P2 auxiliary
  - [[21, 22, 23, 24, 25], 1, MSATMultiLabel, [256, nc, 4, 1, 0, 2.0, 8, True]] # 29-P3/8
  - [29, 1, Index, [-1, 0]] # 30-P3 fused
  - [29, 1, Index, [nc, 1]] # 31-P3 auxiliary
  - [[21, 22, 23, 24, 25], 1, MSATMultiLabel, [512, nc, 4, 2, 0, 2.0, 8, True]] # 32-P4/16
  - [32, 1, Index, [-1, 0]] # 33-P4 fused
  - [32, 1, Index, [nc, 1]] # 34-P4 auxiliary
  - [[21, 22, 23, 24, 25], 1, MSATMultiLabel, [1024, nc, 4, 3, 0, 2.0, 8, True]] # 35-P5/32
  - [35, 1, Index, [-1, 0]] # 36-P5 fused
  - [35, 1, Index, [nc, 1]] # 37-P5 auxiliary
  - [[21, 22, 23, 24, 25], 1, MSATMultiLabel, [1024, nc, 4, 4, 0, 2.0, 8, True]] # 38-P6/64
  - [38, 1, Index, [-1, 0]] # 39-P6 fused
  - [38, 1, Index, [nc, 1]] # 40-P6 auxiliary

  # First five inputs are fused P3/P2/P4/P5/P6 features; the final five are matching auxiliary logits.
  # Head args: [nc, masks, prototypes, multi-label gain, co-occurrence pixel weight].
  - [[30, 27, 33, 36, 39, 31, 28, 34, 37, 40], 1, Segment26MultiLabel, [nc, 32, 256, 0.5, 2.0]] # 41
