# Ultralytics YOLO11 instance segmentation model with a YOLA IIM front-end and a five-scale
# CSAR -> FSNetShuffle -> CSAR segmentation head.
# Based on yolo11-6csar-iim.yaml and the five-scale head in yolo11-0720.yaml.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-FSNetShuffle backbone with an illumination-invariant front-end.
# IIMStem: RGB stem || YOLA IIM (8 shared zero-mean 3x3 kernels per RGB pair) -> Concat -> 1x1 Conv.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, IIMStem, [64, 3, 2, 8, 3]] # 0-P1/2, dual RGB/IIM stem and 1x1 fusion
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4 (main P2 Conv)

  # P2 fusion
  - [-1, 2, AttentionResiduals, [256, 0.25]] # 2-P2/4
  - [[1, 2], 1, FSNetShuffle, [128, 1, 2]] # 3-P2/4

  # P3 fusion
  - [3, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [4, 2, AttentionResiduals, [512, 0.25]] # 5-P3/8
  - [[4, 5], 1, FSNetShuffle, [256, 1, 2]] # 6-P3/8

  # P4 fusion
  - [6, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [7, 2, AttentionResiduals, [512]] # 8-P4/16
  - [[7, 8], 1, FSNetShuffle, [512, 2, 2]] # 9-P4/16

  # P5 fusion
  - [9, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [10, 2, AttentionResiduals, [1024]] # 11-P5/32
  - [[10, 11], 1, FSNetShuffle, [1024, 2, 2]] # 12-P5/32

  - [-1, 1, SPPF, [1024, 5]] # 13
  - [-1, 2, C2PSA, [1024]] # 14-P5/32

# Five-scale CSAR -> FSNetShuffle -> CSAR segmentation head.
# At imgsz=640 the five feature sizes are 160, 80, 40, 20, and 10.
head:
  # Create the P6/64 reference required by the fifth scale.
  - [14, 1, Conv, [1024, 3, 2]] # 15-P6/64

  # First CSAR stage: one output at every source resolution.
  - [[3, 6, 9, 14, 15], 1, MultistateCSAR, [128, 4, 0, 0.5, True]] # 16-P2/4
  - [[3, 6, 9, 14, 15], 1, MultistateCSAR, [256, 4, 1, 0.5, True]] # 17-P3/8
  - [[3, 6, 9, 14, 15], 1, MultistateCSAR, [512, 4, 2, 0.5, True]] # 18-P4/16
  - [[3, 6, 9, 14, 15], 1, MultistateCSAR, [1024, 4, 3, 0.5, True]] # 19-P5/32
  - [[3, 6, 9, 14, 15], 1, MultistateCSAR, [1024, 4, 4, 0.5, True]] # 20-P6/64

  # Exchange all first-stage CSAR features while retaining each target resolution.
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [128, 0, 2]] # 21-P2/4
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [256, 1, 2]] # 22-P3/8
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [512, 2, 2]] # 23-P4/16
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [1024, 3, 2]] # 24-P5/32
  - [[16, 17, 18, 19, 20], 1, FSNetShuffle, [1024, 4, 2]] # 25-P6/64

  # Second CSAR stage after the five FSNetShuffle nodes.
  - [[21, 22, 23, 24, 25], 1, MultistateCSAR, [128, 4, 0, 0.5, True]] # 26-P2/4
  - [[21, 22, 23, 24, 25], 1, MultistateCSAR, [256, 4, 1, 0.5, True]] # 27-P3/8
  - [[21, 22, 23, 24, 25], 1, MultistateCSAR, [512, 4, 2, 0.5, True]] # 28-P4/16
  - [[21, 22, 23, 24, 25], 1, MultistateCSAR, [1024, 4, 3, 0.5, True]] # 29-P5/32
  - [[21, 22, 23, 24, 25], 1, MultistateCSAR, [1024, 4, 4, 0.5, True]] # 30-P6/64

  # Put P3 first so Proto26 produces image/4 masks; P2 still participates in all fusion stages.
  - [[27, 26, 28, 29, 30], 1, Segment26, [nc, 32, 256]] # 31-Segment(P3, P2, P4, P5, P6)
