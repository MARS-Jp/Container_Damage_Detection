# 0929 architecture experiment 03-dualproto. Read docs/damage-architecture-0929.md.
# All variants keep the six-CSAR core, token branches, original state keys and P3/P2/P4/P5 order.
# Newly added residual paths run during both training and inference. No training_aux overrides.
scale: n

# Ultralytics AGPL-3.0 License - https://ultralytics.com/license
# Based on yolo11-6csar.yaml and the second architecture in:
# https://hackmd.io/8gre3-RoQsG02dfl_OER_Q
# AttentionResiduals -> FSNetShuffle -> 6 x CSAR -> damage-token cross-attention -> YOLO segmentation.
# Learned tokens follow dataset class IDs (e.g. Rust / Dent / Hole); no external text encoder is required.
# Train with overlap_mask=False and mask_ratio=4 to retain overlapping instance labels.

nc: 80 # overridden by the dataset class count during training
end2end: False
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Layers 1-20 retain the base definitions; layer 0 keeps its RGB Conv plus a luminance residual.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, LuminanceResidualStem, [64, 3, 2, 0.1]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, AttentionResiduals, [256, 0.25]] # 2-P2/4
  - [[1, 2], 1, FSNetShuffle, [128, 1, 2]] # 3-P2/4
  - [3, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [4, 2, AttentionResiduals, [512, 0.25]] # 5-P3/8
  - [[4, 5], 1, FSNetShuffle, [256, 1, 2]] # 6-P3/8
  - [6, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [7, 2, AttentionResiduals, [512]] # 8-P4/16
  - [[7, 8], 1, FSNetShuffle, [512, 2, 2]] # 9-P4/16
  - [9, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [10, 2, AttentionResiduals, [1024]] # 11-P5/32
  - [[10, 11], 1, FSNetShuffle, [1024, 2, 2]] # 12-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 13
  - [-1, 2, C2PSA, [1024]] # 14-P5/32

head:
  - [[3, 6, 9, 14], 1, CSAR, [512, 4, 1, 0.5, True]] # 15-P3/8
  - [[3, 6, 9, 14], 1, CSAR, [512, 4, 2, 0.5, True]] # 16-P4/16
  - [[3, 6, 9, 14], 1, CSAR, [1024, 4, 3, 0.5, True]] # 17-P5/32
  - [[3, 15, 16, 17], 1, CSAR, [512, 4, 1, 0.5, True]] # 18-P3/8 visual feature
  - [[3, 15, 16, 17], 1, CSAR, [512, 4, 2, 0.5, True]] # 19-P4/16 visual feature
  - [[3, 15, 16, 17], 1, CSAR, [1024, 4, 3, 0.5, True]] # 20-P5/32 visual feature

  # Each branch returns (visual + semantic residual, independent damage logits).
  # Q = learned damage tokens, K/V = flattened visual features.
  # Args: [nc, heads, embedding channels, initial residual scale].
  - [18, 1, DamageSemanticAttention, [nc, 4, 128, 0.001]] # 21-P3
  - [21, 1, Index, [-1, 0]] # 22-P3 semantic-aware feature
  - [21, 1, Index, [nc, 1]] # 23-P3 multi-damage logits

  # Preserve the original head's shallow P2 path from AttentionResiduals layer 2.
  - [2, 1, DamageSemanticAttention, [nc, 4, 128, 0.001]] # 24-P2
  - [24, 1, Index, [-1, 0]] # 25-P2 semantic-aware feature
  - [24, 1, Index, [nc, 1]] # 26-P2 multi-damage logits

  - [19, 1, DamageSemanticAttention, [nc, 4, 128, 0.001]] # 27-P4
  - [27, 1, Index, [-1, 0]] # 28-P4 semantic-aware feature
  - [27, 1, Index, [nc, 1]] # 29-P4 multi-damage logits
  - [20, 1, DamageSemanticAttention, [nc, 4, 128, 0.001]] # 30-P5
  - [30, 1, Index, [-1, 0]] # 31-P5 semantic-aware feature
  - [30, 1, Index, [nc, 1]] # 32-P5 multi-damage logits

  # Preserve feature order P3/P2/P4/P5, so prototypes remain at stride 4.
  # First four: enhanced features; next four: damage logits; final two: shallow P3/P2 (layers 6/3).
  # Args: [nc, masks, prototypes, multi-label gain, overlap pixel weight, initial detail scale].
  - [[22, 25, 28, 31, 23, 26, 29, 32, 6, 3], 1, Segment26MultiLabelExtent, [nc, 32, 256, 0.5, 2.0, 0.1]] # 33
